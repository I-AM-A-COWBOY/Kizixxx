<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenue Maëlys</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="sombre">

  <main class="carte">
    <span class="eyebrow">Accès autorisé</span>
    <span class="emoji-heros">😝</span>
    <h1>C'est moi le plus drôle, et pas toi ! 😝</h1>
    <p class="sous-titre">Tu as trouvé le mot magique, Maëlys. Bravo, entre !</p>
    <a class="lien-retour" id="lien-retour" href="index.html">← Retour à l'accueil</a>
  </main>

  <div class="filigrane">Site créé par <span class="signature">Loucas</span></div>

  <script>
    // Fondu d'entrée à l'arrivée sur la page
    requestAnimationFrame(() => document.body.classList.add('chargee'));

    // Petite pluie de confettis pour l'arrivée
    const emojis = ['🎉', '✨', '😝', '🎊', '⭐'];

    function creerConfetti() {
      const confetti = document.createElement('span');
      confetti.className = 'confetti';
      confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.animationDuration = (2.5 + Math.random() * 2) + 's';
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 5000);
    }

    for (let i = 0; i < 24; i++) {
      setTimeout(creerConfetti, i * 90);
    }

    // Fondu de sortie avant de revenir à l'accueil
    document.getElementById('lien-retour').addEventListener('click', function (evenement) {
      evenement.preventDefault();
      const destination = this.href;
      document.body.classList.remove('chargee');
      document.body.classList.add('sortie');
      setTimeout(() => {
        window.location.href = destination;
      }, 400);
    });
  </script>

</body>
</html>
